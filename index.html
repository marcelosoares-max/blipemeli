<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Blip × Mercado Livre Afiliados · Acesso restrito</title>
<style>
:root{--bg:#0b1020;--card:#121a30;--line:#24304f;--text:#eef2fb;--dim:#9aa6c3;--blip:#0096fa;--meli:#ffe600;--bad:#ff7272;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f2f6fc;--card:#fff;--line:#d6e1f0;--text:#0f1b33;--dim:#55627d;--bad:#d64545;color-scheme:light}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:40px 32px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.18)}
.brand{font-weight:800;font-size:18px;letter-spacing:-.3px;margin-bottom:22px}
.brand .b{color:var(--blip)}.brand .x{color:var(--dim);font-weight:300;margin:0 8px}
.brand .m{background:var(--meli);color:#2d3277;padding:2px 8px;border-radius:6px}
h1{font-size:20px;margin-bottom:6px}
p{font-size:14px;color:var(--dim);line-height:1.5;margin-bottom:22px}
input{width:100%;padding:13px 16px;font-size:15px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--text);outline:none}
input:focus{border-color:var(--blip)}
button{width:100%;margin-top:12px;padding:13px;font-size:15px;font-weight:700;border:0;border-radius:12px;background:var(--blip);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="brand"><span class="b">blip</span><span class="x">×</span><span class="m">Mercado Livre</span></div>
  <h1>Proposta confidencial</h1>
  <p>Digite a senha de acesso para visualizar a apresentação.</p>
  <input id="pw" type="password" placeholder="Senha" aria-label="Senha" autofocus required>
  <button id="go" type="submit">Acessar</button>
  <div class="err" id="err" role="alert"></div>
</form>

  btn.disabled=true;btn.textContent='Abrindo…';err.textContent='';
  try{
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(IV)},key,u(DATA));
    var html=new TextDecoder().decode(buf);
    document.open();document.write(html);document.close();
  }catch(x){
    err.textContent='Senha incorreta. Tente novamente.';
    btn.disabled=false;btn.textContent='Acessar';
  }
});
})();
</script>
